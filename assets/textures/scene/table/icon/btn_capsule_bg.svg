<svg width="212" height="108" viewBox="0 0 212 108" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Linear Gradient from Figma 93:65168 -->
    <linearGradient id="capsule_grad" x1="24" y1="12" x2="188" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="11.95%" stop-color="#606060" stop-opacity="0.5"/>
      <stop offset="77.69%" stop-color="#050505" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Top Inset Highlight Border Gradient from Figma 93:65168 -->
    <linearGradient id="border_grad" x1="0" y1="0" x2="212" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2F2F2" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Dark Glass Capsule Body -->
  <rect x="2" y="2" width="208" height="104" rx="52" fill="url(#capsule_grad)"/>

  <!-- Inner Dark Shadow Tint -->
  <rect x="2" y="2" width="208" height="104" rx="52" fill="#000000" fill-opacity="0.25"/>

  <!-- Highlight Inset Border (0.84px rgba(242,242,242,0.4)) -->
  <rect x="2" y="2" width="208" height="104" rx="52" stroke="url(#border_grad)" stroke-width="2"/>
</svg>
